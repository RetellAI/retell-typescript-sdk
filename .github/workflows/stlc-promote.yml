name: Promote SDKs

on:
  push:
    branches: [main]

concurrency:
  group: sdk-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'RetellAI/retell-typescript-sdk-staging'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_REPO: RetellAI/retell-typescript-sdk
    steps:
      - name: Check out staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint SDK promotion token
        id: sdk-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_MANAGER_PVT_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: retell-typescript-sdk
          permission-contents: write
          permission-pull-requests: write

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git remote add production "https://github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check if production is already in sync
        id: diff
        run: |
          STAGING_SHA=$(git rev-parse origin/main)
          PRODUCTION_SHA=$(git rev-parse production/main)
          if [ "$STAGING_SHA" = "$PRODUCTION_SHA" ]; then
            echo "Production is already at $STAGING_SHA. Nothing to release."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve production-owned files
        if: steps.diff.outputs.synced == 'false'
        run: |
          git config user.name "stlc-bot"
          git config user.email "stlc-bot@users.noreply.github.com"
          git switch --force-create stainless-release origin/main

          restore_from_production_or_remove() {
            local path="$1"
            if git cat-file -e "production/main:${path}" 2>/dev/null; then
              mkdir -p "$(dirname "${path}")"
              git restore --source=production/main -- "${path}"
            else
              git rm -r -f --ignore-unmatch "${path}"
            fi
          }

          git rm -r -f --ignore-unmatch .github/workflows
          git restore --source=production/main -- .github/workflows
          git rm -f --ignore-unmatch .github/workflows/stlc-promote.yml

          for release_path in \
            .release-please-manifest.json \
            CHANGELOG.md
          do
            restore_from_production_or_remove "${release_path}"
          done

          prod_version="$(git show production/main:package.json | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).version));')"
          PROD_VERSION="${prod_version}" node <<'NODE'
            const fs = require("fs");
            for (const path of ["package.json", "packages/mcp-server/package.json"]) {
              const contents = JSON.parse(fs.readFileSync(path, "utf8"));
              contents.version = process.env.PROD_VERSION;
              fs.writeFileSync(path, `${JSON.stringify(contents, null, 2)}\n`);
            }
            const versionPath = "src/version.ts";
            const versionFile = fs.readFileSync(versionPath, "utf8");
            fs.writeFileSync(
              versionPath,
              versionFile.replace(/export const VERSION = '[^']+';/, `export const VERSION = '${process.env.PROD_VERSION}';`),
            );
          NODE

          if ! git diff --quiet HEAD -- \
            .github/workflows \
            .release-please-manifest.json \
            CHANGELOG.md \
            package.json \
            packages/mcp-server/package.json \
            src/version.ts
          then
            git add -A -- \
              .github/workflows \
              .release-please-manifest.json \
              CHANGELOG.md \
              package.json \
              packages/mcp-server/package.json \
              src/version.ts
            git commit -m "chore: preserve production workflow files"
          fi

      - name: Check whether promotion is needed
        if: steps.diff.outputs.synced == 'false'
        id: promotion
        run: |
          set -euo pipefail
          commit_messages=$(git log --format=%B production/main..HEAD)
          # Production-only changes survive the merge and must not count as SDK updates.
          merged_tree=$(git merge-tree --write-tree production/main HEAD)
          if git diff --quiet production/main "$merged_tree" && \
            ! grep -Eq '^Release-As: [0-9]+\.[0-9]+\.[0-9]+([+-][[:alnum:].-]+)?[[:space:]]*$' <<< "$commit_messages"
          then
            echo "Prepared SDK matches production and has no reserved release; nothing to promote."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release branch on production
        if: steps.promotion.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse production/main)
          git fetch production main
          if [ "$(git rev-parse production/main)" != "$base_sha" ]; then
            echo "::error::Production main changed during promotion; rerun against the latest main."
            exit 1
          fi
          git fetch production "+refs/heads/stainless-release:refs/remotes/production/stainless-release" || true
          git push --force-with-lease production HEAD:refs/heads/stainless-release

      - name: Open or update the release PR on production
        if: steps.promotion.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.sdk-token.outputs.token }}
          APP_SLUG: ${{ steps.sdk-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/sdk-commits.txt"
          git log --format=%B production/main..HEAD > "$log_file"
          handles=$(sed -n 's/^cc //p' "$log_file" | grep -oE '@[A-Za-z0-9][A-Za-z0-9-]*' | sort -u | head -5 | paste -sd' ' - || true)
          body_file="$RUNNER_TEMP/sdk-release-pr.md"
          removals=$(awk '/^BREAKING CHANGE:/ { print; while (getline > 0 && NF) print }' "$log_file")
          {
            printf 'Updates the generated SDK from the coordinated docs build.\n\n'
            printf 'Source changes:\n'
            git log --format='- %s' production/main..HEAD | sed '/^- chore: preserve production workflow files$/d'
            sed -n 's|^Source: RetellAI/docs@\([a-f0-9]\{40\}\)$|- https://github.com/RetellAI/docs/commit/\1|p; /^Backend changes: /p; /^- .*https:\/\/github.com\/RetellAI\/retell-backend\/pull\/[0-9]/p' "$log_file" | sort -u
            printf '\nSDK versions reserved by these builds:\n'
            sed -n 's/^Release-As: /- /p' "$log_file" | sort -Vu
            if [ -n "$removals" ]; then printf '\nRemoved SDK methods:\n%s\n' "$removals"; fi
            printf '\nValidation: auto-merge waits for SDK CI and all PR checks on the current commit.\n'
            printf 'Promotion workflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [ -n "$handles" ]; then printf '\ncc %s\n' "$handles"; fi
          } > "$body_file"
          EXISTING_PR=$(gh pr list --repo "$PRODUCTION_REPO" --head stainless-release --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            author=$(gh pr view "$EXISTING_PR" --repo "$PRODUCTION_REPO" --json author --jq '.author.login')
            if [ "$author" != "${APP_SLUG}[bot]" ] && [ "$author" != "app/${APP_SLUG}" ]; then
              gh pr close "$EXISTING_PR" --repo "$PRODUCTION_REPO" \
                --comment "The GitHub App will replace this promotion PR so future updates use the bot identity."
              EXISTING_PR=""
            fi
          fi
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo "$PRODUCTION_REPO" --base main --head stainless-release \
              --title "Release SDK updates" --body-file "$body_file"
          else
            previous_handles=$(gh pr view "$EXISTING_PR" --repo "$PRODUCTION_REPO" --json body --jq '.body' \
              | grep -oE '@[A-Za-z0-9][A-Za-z0-9-]*' | sort -u | paste -sd' ' - || true)
            gh pr edit "$EXISTING_PR" --repo "$PRODUCTION_REPO" --body-file "$body_file"
            added=""
            for handle in $handles; do
              case " $previous_handles " in
                *" $handle "*) ;;
                *) added="${added:+$added }$handle" ;;
              esac
            done
            if [ -n "$added" ]; then
              gh pr comment "$EXISTING_PR" --repo "$PRODUCTION_REPO" \
                --body "$added — this SDK update now also includes your source changes. See the source links in the description."
            fi
          fi
